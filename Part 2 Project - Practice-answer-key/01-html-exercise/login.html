<html lang="en">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
	<script src="js/script.js"></script> 
</head>
<body>
<div class="navbar navbar-default">
    <div class="container">
        <div class="navbar-header">
            <a href="index.html" class="navbar-brand"></a>
        </div>
        <label id="toggle-label" class="visible-xs-inline-block" for="toggle-checkbox">MENU</label>
        <input id="toggle-checkbox" class="hidden" type="checkbox"/>
        <div class="hidden-xs">
            <ul class="nav navbar-nav">
                <li class="active"><a href="#">HomePage</a></li>      
            </ul>
            <ul class="navbar-right nav navbar-nav">

                <li><a href="signup.html">Register</a></li>
            </ul>

    </div>
</div>


<div class="container container-small">
    <h1>Sign in
        <small>？<a href="signup.html">Register</a></small>
    </h1>
    <form onsubmit="return validateLoginForm()">
		<!--Task: Add a user input box with id valued "username" -->
		<!--your code here-->	
        <div class="form-group">
            <label>User Name</label>
            <input type="text" class="form-control" id="username" required>
        </div>
		
		<!--Task: Add a password input box with id valued "password" -->
		<!--your code here-->	
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
		
		<!--Task: Add a sign in button with type valued "submit" " -->
		<!--your code here-->	
        <div class="form-group">
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </div>
        <div class="form-group">
            <a href="#">Forgot password？</a>
        </div>

    </form>

</div>

<div class="footer">
   
</div>


</body>
